  - id: a1.access.expel
    status: partial
    confidence: medium
    change: unchanged
    evidence: [e-review]
    note: "Refusal of entry and ejection are licensable activities. A single set of consequences for refusing to leave was not read."
  - id: a1.police.role
    status: met
    confidence: high
    change: amended
    evidence: [e-review]
    note: "UKFPU coordinates national football policing and moved from the Home Office to the NPCC in April 2023. Policing is devolved in Scotland and Northern Ireland."
