gaps:
  - indicator: a1.gov.strategy
    question: "Is there a published strategy on safety, security and service, for the UK or any of the three jurisdictions, and is it reviewed?"
  - indicator: a1.safety.officer
    question: "Is a safety officer a condition of the safety certificate in England and Wales, Scotland, and Northern Ireland?"
  - indicator: a2.status.qualified
    question: "Do Scottish and Northern Ireland certificates require the same Level 2 qualification and vetting for in-house stewards as the SGSA directed in England and Wales?"
  - indicator: a1.svc.volunteers
    question: "Are volunteer stewards allowed in the safety role, and is their training defined?"
  - indicator: a1.venue.cctv
    question: "Is CCTV a condition of the certificate at designated grounds?"
  - indicator: a1.emerg.exercise
    question: "Do certificates require a contingency plan and a recorded exercise, and how often?"
  - indicator: a1.police.risk
    question: "Is there a written policy for categorising supporters by risk, and what safeguards does it contain?"
  - indicator: a1.dial.slo
    question: "Which competitions require a supporter liaison officer and a disability access officer, beyond the Premier League?"
  - indicator: a2.conduct.code
    question: "Is a stewards' code of conduct, and high-visibility numbering, a certificate condition or only guidance?"
  - indicator: a1.police.ban
    question: "Has the Scottish Government's proposed widening of football banning orders been enacted?"
  - indicator: citation-search
    question: "Does any UK instrument cite Recommendation Rec(2022)2?"
