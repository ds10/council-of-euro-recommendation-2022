indicators:
  - id: a1.gov.committee
    status: partial
    confidence: high
    change: unchanged
    evidence: [e-review]
    note: "SGSA oversees football safety certification in England and Wales. UKFPU coordinates football policing. No single body for safety, security and service."
  - id: a1.gov.local
    status: met
    confidence: medium
    change: unchanged
    evidence: [e-review]
    note: "Councils issue certificates. A certificate or prohibition notice cannot require police without the chief officer's agreement. Safety advisory groups are usual practice; a statute requiring that name was not read."
  - id: a1.gov.strategy
    status: not_found
    confidence: medium
    change: unknown
    evidence: [e-review]
    note: "No published national strategy found. The Saint-Denis Convention has been in force for the UK since 1 December 2023."
  - id: a1.gov.roles
    status: met
    confidence: high
    change: unchanged
    evidence: [e-review]
    note: "Roles are split across the 1975 Act, the SGSA licence in England and Wales, and UKFPU."
  - id: a1.safety.integrated
    status: partial
    confidence: high
    change: amended
    evidence: [e-review]
    note: "SGSA factsheet of 1 August 2023 describes the Council of Europe integrated approach. It is guidance. The convention has been in force since 1 December 2023."
  - id: a1.safety.operator
    status: met
    confidence: high
    change: unchanged
    evidence: [e-review]
    note: "Health and Safety at Work etc. Act 1974, as described by SGSA. Sport NI places first responsibility on owners and operators."
  - id: a1.safety.officer
    status: partial
    confidence: medium
    change: unchanged
    evidence: [e-review]
    note: "Described in SGSA factsheet 1 and the Green Guide. Not read as a section of an Act."
  - id: a1.safety.regulations
    status: partial
    confidence: medium
    change: unchanged
    evidence: [e-review]
    note: "1985 Act bans alcohol in sight of the pitch, and fireworks and flares, at designated football. A statute requiring ground regulations was not read."
  - id: a1.cert.required
    status: met
    confidence: high
    change: unchanged
    evidence: [e-review]
    note: "1975 Act for designated grounds; 1987 Act for regulated stands; Northern Ireland Order 2006. SGSA licence is additional for designated football in England and Wales."
  - id: a1.cert.authority
    status: met
    confidence: high
    change: unchanged
    evidence: [e-review]
    note: "Local authorities in Britain; district councils in Northern Ireland. SGSA can refuse the football licence in England and Wales."
  - id: a1.cert.capacity
    status: met
    confidence: high
    change: unchanged
    evidence: [e-review]
    note: "Sport NI states that the Northern Ireland certificate sets a safe capacity. Certificate terms do this under the 1975 Act."
  - id: a1.cert.inspect
    status: met
    confidence: high
    change: unchanged
    evidence: [e-review]
    note: "Sport NI: district councils inspect designated grounds at least every 12 months. Local authorities enforce in Britain."
  - id: a1.cert.enforce
    status: met
    confidence: high
    change: unchanged
    evidence: [e-review]
    note: "Admitting spectators without a certificate, or in breach of it, is an offence. Prohibition notices can restrict admission."
  - id: a1.venue.infrastructure
    status: partial
    confidence: medium
    change: unchanged
    evidence: [e-review]
    note: "Certificates can require alterations. Detailed physical standards sit mainly in the Green Guide."
  - id: a1.venue.segregation
    status: partial
    confidence: medium
    change: unchanged
    evidence: [e-review]
    note: "All-seater and separation arrangements are part of SGSA licensing for designated football in England and Wales. Not confirmed for Scotland or Northern Ireland in this pass."
  - id: a1.venue.cctv
    status: partial
    confidence: low
    change: unchanged
    evidence: [e-review]
    note: "Factsheet 1 describes CCTV as a typical safety system. A legal requirement was not read."
  - id: a1.venue.operations
    status: partial
    confidence: medium
    change: unchanged
    evidence: [e-review]
    note: "SGSA told a parliamentary committee that football venues have operations manuals covering stewarding, evacuation and medical provision."
  - id: a1.emerg.plan
    status: partial
    confidence: medium
    change: unchanged
    evidence: [e-review]
    note: "Fire Safety Order 2005 requires recorded fire arrangements in England and Wales. A single all-hazard emergency-plan duty was not read."
  - id: a1.emerg.contingency
    status: partial
    confidence: low
    change: unchanged
    evidence: [e-review]
    note: "Described as part of operations-manual practice. Not read as a named statutory duty."
  - id: a1.emerg.evacuation
    status: partial
    confidence: medium
    change: unchanged
