gaps:
  - indicator: a1.gov.strategy
    question: "Is there a published national strategy on safety, security and service at football / sports events, and is it kept under review?"
  - indicator: a1.cert.required
    question: "Does any authority issue a standing stadium safety certificate with a stated safe capacity beyond the municipal event permit and EJL category standards?"
  - indicator: a2.status.qualified
    question: "Are organiser-provided stewards (korrapidajad) subject to mandatory training, vetting, and identification rules equivalent to licensed security guards?"
  - indicator: a1.police.ban
    question: "Is there a statutory administrative or judicial football stadium ban, and a central database used at ticket gates?"
  - indicator: a1.dial.slo
    question: "Are Supporter Liaison Officers and Disability Access Officers required by law or only by UEFA/EJL licensing practice?"
  - indicator: a1.venue.cctv
    question: "Is CCTV mandatory at all designated football stadia, or only where EJL category / venue rules require it?"
  - indicator: a1.police.nfip
    question: "What is the current organisational home and public page of the Estonian NFIP within the Police and Border Guard Board?"
  - indicator: a1.gov.committee
    question: "Has any Estonian instrument adopted or cited Recommendation Rec(2022)2 by name since 2022?"
  - indicator: a1.safety.operator
    question: "Which July 2025 Sport Act amendments are already in force for football matches as of this review, and which wait until 2026?"
  - indicator: a1.emerg.exercise
    question: "Are emergency plans and recorded evacuation exercises required by statute for all permitted football events?"
