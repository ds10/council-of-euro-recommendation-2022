gaps:
  - indicator: a1.gov.strategy
    question: "Is there a published national strategy on safety, security and service (for example the BMI platform Sicherheit und Sport), and is it kept under review?"
  - indicator: a1.cert.required
    question: "Do all nine Länder require a Veranstaltungsstättenbewilligung or equivalent with a stated safe capacity for football stadia above a common threshold?"
  - indicator: a2.status.vetting
    question: "Is criminal-record or reliability vetting required by law for every Ordner at designated sports events, including in-house club staff?"
  - indicator: a2.train.ct
    question: "Does steward training mandatorily cover counter-terrorism awareness and discriminatory behaviour, and where is that syllabus published?"
  - indicator: a2.conduct.visible
    question: "Is a unique steward number required on clothing, or only a recognisable Ordnerweste?"
  - indicator: a1.dial.dao
    question: "Is a named disability access officer (or equivalent) required for Bundesliga or ÖFB events?"
  - indicator: a1.police.database
    question: "Please confirm the legal basis and current practice for the Gewalttäterdatei Sport and for sharing ÖFB stadium-ban data with the police."
  - indicator: a1.gov.committee
    question: "Has any Land or federal instrument adopted or cited Recommendation Rec(2022)2 by name since 2022?"
  - indicator: a1.emerg.plan
    question: "What changed in Wiener Veranstaltungsgesetz § 31 from 1 July 2026 that affects football events?"
  - indicator: a1.svc.volunteers
    question: "Are volunteer Ordner permitted in the safety role, and under what limits?"
